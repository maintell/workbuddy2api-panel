name: release

# 单一发版流水线 = 原 go-binaries + docker-ghcr 的合并版。
#
# 为什么合并：原来两个 workflow 各自监听 `push main` 与 `push tag v*`，于是「推
# main 再打 tag」这种一次发版会并发跑 4 条 run（main×2 + tag×2）、把同一份代码
# 编译三遍以上，而且镜像与二进制未必出自同一 commit。
#
# **只有发版 tag 会真正跑流水线**（main 上的普通提交不再触发任何 run，代码正确性
# 由 tag 上的 test job 兜底）：
#   - push tag v*  → 一条 run：test → 五平台二进制 → GitHub Release → ghcr 镜像
#   - pull_request → 只跑 test（不构建、不推送），保护 go.mod / 代码改动
#   - 其余（含 push main）→ 不触发
#
# 手动重跑（Actions 抽风 / 只想补镜像）必须指定 tag ref：
#   gh workflow run release.yml --ref v1.2.3
#
# 发布纪律（沿用原 workflow）：-s -w 剥离、二进制版本串 == 源码 appVersion、
# tag 版本 == 源码版本（-ci 演练 tag 豁免，且演练不会移动 1.15 / latest 这类浮标）。

on:
  push:
    # 不在分支上触发：main 只作为代码集成分支，产物一律由 tag 产出，
    # 避免「一次发版多条 run、多个分支各跑一遍」。
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - "*.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# PR 取消过时的运行；tag 串行（同 tag 重跑不会叠加）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试会真实执行
      - run: go test ./...

  # 五平台二进制：只在 tag 上跑。
  binaries:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取源码版本号
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言二进制版本串
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          V="${V%-panel}"   # 文件名不带 -panel 后缀（wb2api-panel-v1.2.3-... 既有惯例）
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-v${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # 汇总资产 → 建/更新 Release。仅在 tag 上跑。
  release:
    needs: [test, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: tag 与源码版本一致性断言
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          SRC="${SRC%-panel}"   # appVersion 带 -panel 后缀，比对前剥掉
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la

      # 幂等发布：Release 已存在（人工补发过 / 重跑同一条 run）时更新说明并覆盖资产，
      # 不让整个流水线因为 "release already exists" 挂掉。
      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "CI 自动构建发布：五平台二进制 + checksums，同一条 run 里产出 ghcr 多架构镜像。"
            echo
            echo "镜像：\`ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}\`（linux/amd64 + linux/arm64）"
            if [[ -n "$PREV" ]]; then
              echo
              echo "完整变更：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "${TAG}-panel" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            args=(--verify-tag --title "${TAG}-panel" --notes-file notes.md)
            [[ "$TAG" == *-* ]] && args+=(--prerelease)
            gh release create "$TAG" "${args[@]}" dist/*
          fi

  # ghcr 多架构镜像：与 binaries 并行（都只依赖 test），tag 上没有 main 分支浮标。
  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU（arm64 交叉模拟）
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 只发 tag 相关浮标：{{version}} / {{major}}.{{minor}} / latest / sha-xxxxxxx。
      # -ci 演练 tag 不打 1.15、latest——否则演练会把线上浮标指到演练镜像。
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-ci') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-ci') }}
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation：避免 ghcr 页面出现 unknown/unknown 架构条目
          provenance: false
